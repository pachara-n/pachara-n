      <text x="236" y="174" class="mono">
        <tspan class="pr">coreStack</tspan><tspan class="pun">: [</tspan><tspan class="str">"TypeScript"</tspan><tspan class="pun">, </tspan><tspan class="str">"Next.js"</tspan><tspan class="pun">, </tspan><tspan class="str">"NestJS"</tspan><tspan class="pun">, </tspan><tspan class="str">"PostgreSQL"</tspan><tspan class="pun">, </tspan><tspan class="str">"Redis"</tspan><tspan class="pun">],</tspan>
      </text>

      <text x="206" y="196" class="ln">7</text>
      <text x="236" y="196" class="mono">
        <tspan class="pr">portfolio</tspan><tspan class="pun">: </tspan><tspan class="str">"https://pachara.app"</tspan><tspan class="pun">,</tspan>
      </text>

