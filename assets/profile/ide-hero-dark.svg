      </text>

      <text x="206" y="130" class="ln">4</text>
      <text x="236" y="130" class="mono">
        <tspan class="pr">role</tspan><tspan class="pun">:      </tspan><tspan class="str">"Backend-leaning Full-Stack Developer"</tspan><tspan class="pun">,</tspan>
      </text>

